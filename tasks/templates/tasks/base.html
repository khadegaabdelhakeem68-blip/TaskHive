<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskHive 🐝</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-2">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-warning" href="{% url 'task_list' %}">TaskHive 🐝</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="ms-auto d-flex align-items-center gap-3">
                    {% if user.is_authenticated %}
                        <span class="text-light mb-0">Welcome, <strong class="text-warning">{{ user.username }}</strong>!</span>
                        
                        <a class="btn btn-sm btn-success px-3 fw-bold" href="{% url 'create_task' %}">+ Post Task</a>
                        
                        <form method="POST" action="{% url 'logout' %}" class="m-0">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-outline-light px-3">Logout</button>
                        </form>
                    {% else %}
                        <a class="btn btn-sm btn-outline-light me-2" href="{% url 'login' %}">Login</a>
                        <a class="btn btn-sm btn-warning fw-bold" href="{% url 'register' %}">Sign Up</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
